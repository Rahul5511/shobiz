@if (s.view === 'password') {
  <div class="page-title">
    <div>
      <h1>Change Password</h1>
      <p>Update your demo account password for the running browser session.</p>
    </div>
  </div>
  <section class="card padded password-card">
    <form #passwordForm="ngForm" (ngSubmit)="c.changePassword()">
      <label
        >Current password<input
          type="password"
          name="currentPassword"
          [(ngModel)]="c.currentPassword"
          required
          autocomplete="current-password" /></label
      ><label
        >New password<input
          type="password"
          name="newPassword"
          [(ngModel)]="c.newPassword"
          required
          minlength="8"
          autocomplete="new-password" /></label
      ><label
        >Confirm new password<input
          type="password"
          name="confirmPassword"
          [(ngModel)]="c.confirmPassword"
          required
          autocomplete="new-password"
      /></label>
      <p class="muted small">
        Demo rule: at least 8 characters. Production password rules remain to be finalised in the
        FRD. No backend password service is connected.
      </p>
      <button class="primary" [disabled]="!passwordForm.valid">Change Password</button>
    </form>
  </section>
}
